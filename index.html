<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HGH</title>
    <script>
      (function() {
        var p = window.location.pathname;
        var h = window.location.hash;
        var s = window.location.search;
        var hasToken = h.includes('access_token=') || s.includes('code=') || h.includes('type=');
        var hasError = s.includes('error=') || h.includes('error=');
        
        if (hasToken || hasError) {
            sessionStorage.setItem('hgh_auth_search', s);
            sessionStorage.setItem('hgh_auth_hash', h);
            if (p !== '/activation' && p !== '/reset-password') {
                window.location.replace('/activation' + s + h);
            }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
